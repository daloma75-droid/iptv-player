name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir el proyecto
        run: |
          unzip -q proyecto.zip -d src
          ls src/app

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compilar APK
        working-directory: src/app
        run: gradle assembleDebug --no-daemon

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: iptv-player-apk
          path: src/app/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: IPTV Player (última versión)
          files: src/app/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
